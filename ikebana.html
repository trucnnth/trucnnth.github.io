<script>
  // Applied before first paint so dark mode never flashes light. The button
  // label is set later, once the DOM exists.
  (function() {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();

<style>
:root {
  --navy: #051C2C;
  --blue: #2251FF;
  --blue-hover: #1a3fcc;
  --text: #1a1a1a;

  --bg-alt: #f2f4f6;
  --bg-card: #ffffff;
  --border: #dde1e6;
  --border-light: #eaedf0;
  --white: #ffffff;

  --nav-text: rgba(255,255,255,0.65);
  --nav-text-hover: #ffffff;
}

[data-theme="dark"] {
  --navy: #e8e6e1;
  --blue: #5b8aff;
  --blue-hover: #7da3ff;
  --text: #e0ddd8;
  --text-secondary: #a09d98;

  --bg: #111110;

  --bg-card: #1e1d1c;

}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {

  color: var(--text);
  background: var(--bg);

  font-size: 16px;

}

a { color: var(--blue); text-decoration: none; }

.container { max-width: 840px; margin: 0 auto; padding: 0 24px; }

/* Nav */
.topnav {
  position: sticky; top: 0; z-index: 100;
  background: var(--nav-bg);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
.topnav .container {
  display: flex; justify-content: space-between; align-items: center; height: 56px;
}
.topnav .site-name {

  font-size: 1.05rem; font-weight: 700; color: var(--white);
}
.topnav .nav-right { display: flex; gap: 12px; align-items: center; }
.topnav .nav-right a {
  font-size: 0.8rem; font-weight: 600; color: var(--nav-text);
  padding: 6px 12px; border-radius: 5px; transition: all 0.2s;
}
.topnav .nav-right a:hover { color: var(--nav-text-hover); background: rgba(255,255,255,0.08); }
.theme-toggle {
  background: none; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 5px; padding: 5px 10px; cursor: pointer;
  font-size: 0.85rem; color: var(--nav-text); transition: all 0.2s;
}
.theme-toggle:hover { border-color: rgba(255,255,255,0.5); color: var(--nav-text-hover); }

/* Header */
.page-header {
  padding: 16px 0 12px;
  text-align: center;
}
.page-header h1 {
  font-family: 'Libre Baskerville', serif;
  font-size: 1.8rem; font-weight: 700; color: var(--navy);
}
.page-header .subtitle {
  font-size: 0.95rem; color: var(--text-secondary); margin-top: 4px;
}
.page-header .subtitle a {

}

/* Pixel banner */
.pixel-banner {

  position: relative;
  border-bottom: 4px solid #b09060;
  margin-bottom: 0;
}
[data-theme="dark"] .pixel-banner {

}
.pixel-banner canvas {
  display: block;
  width: 100%;

.pixel-banner-caption {

/* Content */

/* Gallery */

}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;

.gallery-item { margin: 0; }
.gallery-item .g-open {
  display: block; width: 100%; padding: 0;
  border: none; background: none; cursor: zoom-in;
}
.gallery-item img {
  display: block; width: 100%; aspect-ratio: 1 / 1;
  object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border-light);
  transition: transform 0.2s, box-shadow 0.2s;
}
.gallery-item .g-open:hover img,
.gallery-item .g-open:focus-visible img {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.gallery-item figcaption {
  text-align: center; margin-top: 7px; line-height: 1.4;
}
.gallery-item .g-title {
  display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary);
}
.gallery-item .g-date {
  display: block; font-size: 0.75rem; color: var(--text-light);
}
@media (max-width: 640px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gallery-item .g-title { font-size: 0.8rem; }
  .gallery-item .g-date { font-size: 0.7rem; }
}

/* Lightbox */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  display: none; background: rgba(0,0,0,0.9);
}
.lightbox.open {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
.lightbox img {
  max-width: min(92vw, 1000px); max-height: 76vh;
  object-fit: contain; border-radius: 6px;
}
.lightbox-caption {
  color: rgba(255,255,255,0.85); font-size: 0.85rem;
  margin-top: 14px; text-align: center; padding: 0 48px; max-width: 640px;
}
.lightbox-caption .lb-date { color: rgba(255,255,255,0.55); }
.lightbox-caption a { color: #fff; text-decoration: underline; }
.lb-btn {
  position: absolute; background: none; border: none;
  color: rgba(255,255,255,0.65); cursor: pointer;
  line-height: 1; padding: 14px 20px; transition: color 0.2s;
}
.lb-btn:hover { color: #fff; }
.lb-close { top: 6px; right: 10px; font-size: 2rem; }
.lb-prev, .lb-next { top: 50%; transform: translateY(-50%); font-size: 2.4rem; }
.lb-prev { left: 2px; }
.lb-next { right: 2px; }
@media (max-width: 640px) {
  .lightbox-caption { padding: 0 20px; }
  .lb-prev, .lb-next { font-size: 1.8rem; padding: 10px 12px; }
}

  border: 1px solid var(--border);

.instagram-info {

footer {

  text-align: center; font-size: 0.82rem; color: var(--text-light);
}
</style>

<script>
// Theme
function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('.theme-toggle').textContent = next === 'dark' ? '🌙' : '☀️';
}
// Theme is already applied in <head> (before first paint). Only the
  // button label needs syncing once the DOM exists.
  document.querySelector('.theme-toggle').textContent =
    document.documentElement.getAttribute('data-theme') === 'dark' ? '\uD83C\uDF19' : '\u2600\uFE0F';
</script>

<script>
// Lightbox for the gallery figures above
(function() {
  const figures = Array.from(document.querySelectorAll('.gallery-item'));
  if (!figures.length) return;

  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCaption = document.getElementById('lb-caption');
  const prevBtn = document.getElementById('lb-prev');
  const nextBtn = document.getElementById('lb-next');

  // Read the photos straight out of the markup above — no separate data file.
  const photos = figures.map(fig => {
    const img = fig.querySelector('img');
    const title = fig.querySelector('.g-title');
    const meta = fig.querySelector('.g-date');
    return {
      src: img.getAttribute('src'),
      alt: img.getAttribute('alt'),
      title: title ? title.textContent : '',
      meta: meta ? meta.textContent : '',
      link: fig.dataset.link || ''
    };
  });

  let current = 0;
  let lastFocused = null;

  function show(i) {
    current = (i + photos.length) % photos.length;
    const p = photos[current];
    lbImg.src = p.src;
    lbImg.alt = p.alt || p.title || '';

    lbCaption.textContent = '';
    if (p.title) lbCaption.append(p.title);
    if (p.meta) {
      const d = document.createElement('span');
      d.className = 'lb-date';
      d.textContent = (p.title ? ' — ' : '') + p.meta;
      lbCaption.append(d);
    }
    if (p.link) {
      const a = document.createElement('a');
      a.href = p.link;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'View on Instagram';
      lbCaption.append(document.createElement('br'), a);
    }
  }

  function open(i) {
    lastFocused = document.activeElement;
    show(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('lb-close').focus();
  }

  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    lbImg.src = '';
    if (lastFocused) lastFocused.focus();
  }

  document.getElementById('lb-close').addEventListener('click', close);
  prevBtn.addEventListener('click', () => show(current - 1));
  nextBtn.addEventListener('click', () => show(current + 1));
  lb.addEventListener('click', e => { if (e.target === lb) close(); });

  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowLeft' && photos.length > 1) show(current - 1);
    else if (e.key === 'ArrowRight' && photos.length > 1) show(current + 1);
  });

  figures.forEach((fig, i) => {
    fig.querySelector('.g-open').addEventListener('click', () => open(i));
  });

  const solo = photos.length < 2;
  prevBtn.hidden = solo;
  nextBtn.hidden = solo;
})();
</script>
